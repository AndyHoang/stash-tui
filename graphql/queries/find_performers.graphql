query FindPerformers($filter: FindFilterType, $performer_filter: PerformerFilterType, $ids: [ID!]) {
  findPerformers(filter: $filter, performer_filter: $performer_filter, ids: $ids) {
    count
    performers {
      id
      name
      gender
      favorite
      image_path
      scene_count
      tags {
        id
        name
      }
    }
  }
}
